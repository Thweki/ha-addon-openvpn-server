# Base images are pulled from a mirror because ghcr.io blobs
# (*.githubusercontent.com) are not reliably reachable from mainland China.
# Point these back at ghcr.io/home-assistant/<arch>-base:3.22 if you build outside China.
build_from:
  aarch64: "ghcr.nju.edu.cn/home-assistant/aarch64-base:3.22"
  amd64: "ghcr.nju.edu.cn/home-assistant/amd64-base:3.22"
labels:
  org.opencontainers.image.title: "OpenVPN Server"
  org.opencontainers.image.description: "Home Assistant OpenVPN server add-on"
