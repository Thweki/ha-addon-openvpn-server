name: Profile credential validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify OpenSSL is available
        run: openssl version

      - name: Validate exported credentials with OpenSSL
        env:
          PYTHONPATH: addon/src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s tests/integration -v
