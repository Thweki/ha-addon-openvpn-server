name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests-and-lint:
    name: Python tests and focused lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install lint dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: addon/src
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax and likely runtime errors
        run: python -m ruff check --select E9,F63,F7,F82 addon/src tests
